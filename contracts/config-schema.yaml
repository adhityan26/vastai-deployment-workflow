version: 1
keys:
  # --- credentials injected by Vast or by the bot (instance) ---
  - {name: CONTAINER_ID, components: [instance], type: str, secret: false, required: true, default: null, description: "Vast instance id (injected by Vast)"}
  - {name: CONTAINER_API_KEY, components: [instance], type: str, secret: true, required: true, default: null, description: "Per-instance Vast key, can only manage its own instance (injected by Vast)"}
  - {name: AGENT_TOKEN, components: [instance], type: str, secret: true, required: true, default: null, description: "Bearer token for the agent API, one per instance (created by the bot)"}
  - {name: TS_AUTHKEY, components: [instance], type: str, secret: true, required: false, default: "", description: "Single-use Tailscale auth key, blanked after use"}
  - {name: HF_TOKEN, components: [instance], type: str, secret: true, required: false, default: "", description: "Optional Hugging Face token for model downloads"}
  # --- identity and bootstrap inputs (instance) ---
  - {name: TS_HOSTNAME, components: [instance], type: str, secret: false, required: true, default: null, description: "Unique tailnet hostname for this instance"}
  - {name: TS_TAG, components: [instance], type: str, secret: false, required: false, default: "tag:gpu", description: "Tailscale tag advertised by the instance"}
  - {name: TS_SOCKET, components: [instance], type: str, secret: false, required: false, default: "/var/run/tailscale/tailscaled.sock", description: "tailscaled socket path"}
  - {name: REPO_URL, components: [instance, apps], type: str, secret: false, required: true, default: null, description: "Git URL of this repository"}
  - {name: REPO_COMMIT, components: [instance, apps], type: str, secret: false, required: true, default: null, description: "Pinned commit that bootstrap checks out"}
  - {name: PROFILE, components: [instance, apps], type: str, secret: false, required: true, default: null, description: "Profile name, e.g. image"}
  - {name: KEEP_ON_FAILURE, components: [instance], type: bool, secret: false, required: false, default: false, description: "Do not self-destroy on boot failure (debugging only)"}
  - {name: VIDEO_ENABLED, components: [apps, instance], type: bool, secret: false, required: false, default: false, description: "Switches the profile's video section on (the Video tool, its API and, on the instance, the video model checks). Needs all its model files pinned in the profile's models: (the web app and the boot refuse the profile otherwise). The web app passes true to the instance; false sends nothing, so an image-only instance env is unchanged"}
  - {name: VIDEO_FAMILIES, components: [apps, instance], type: csv, secret: false, required: false, default: "", description: "Ids of the profile's video_families: to switch on besides the base video section (only with VIDEO_ENABLED=true). Each needs all its model files pinned in the profile's models: (the web app and the boot refuse the profile otherwise); an unknown id is refused. The web app passes the list to the instance; empty sends nothing"}
  - {name: VIDEO_BOOT_FAMILIES, components: [instance], type: csv, secret: false, required: false, default: "", description: "With INCLUDE_VIDEO_MODELS: the video family ids whose model files the boot downloads (set by the web app from the Start dialog). Empty: the base video section only. Every id must be an enabled family (VIDEO_ENABLED, VIDEO_FAMILIES); the boot refuses others"}
  - {name: INCLUDE_VIDEO_MODELS, components: [instance], type: bool, secret: false, required: false, default: false, description: "Download the profile's video model files at boot and require the video node classes before ready (set by the web app from the Start dialog's Include video models). false: the boot is image-only; the video files can still be fetched later on demand through the agent's POST /video-models"}
  - {name: VIDEO_MODEL_URL, components: [instance], type: str, secret: false, required: false, default: "", description: "Set by the web app from the Start dialog's video model link (only with INCLUDE_VIDEO_MODELS): an https Hugging Face .safetensors file link that replaces the video section's diffusion model for this boot. Validated again on the instance; NOT integrity-pinned (the sha256 of what arrived is only reported). Empty: the pinned model"}
  - {name: VIDEO_MODEL_LINK_HOSTS, components: [instance, apps], type: csv, secret: false, required: false, default: "huggingface.co", description: "Hosts a video model link may name (exact, lower-case); the web app checks links against it and passes it to the instance with every start of a profile with video"}
  - {name: VIDEO_MODEL_LINK_REDIRECT_DOMAINS, components: [instance, apps], type: csv, secret: false, required: false, default: "huggingface.co,hf.co", description: "Domains a linked download may be redirected to (the host or any subdomain at a dot: the model host's CDN); every request of the download is checked before it is sent (https, port 443, no user info, no IP literal)"}
  - {name: LORA_LINK_MAX_BYTES, components: [instance, apps], type: int, secret: false, required: false, default: 2147483648, min: 1048576, description: "Largest extra LoRA file (added by link from the page) in bytes, from a HEAD on the instance before the disk check and the download; the web app passes it to the instance with every start while video is on"}
  - {name: LORA_TOTAL_MAX_BYTES, components: [instance], type: int, secret: false, required: false, default: 10737418240, min: 1048576, description: "Most bytes of extra LoRA files (added by link from the page) one instance downloads in all; a file that would pass it fails with lora_total_too_large. They come after the boot, outside its disk estimate, so this bounds what they take from the free disk"}
  - {name: VIDEO_MODEL_LINK_MAX_BYTES, components: [instance, apps], type: int, secret: false, required: false, default: 21474836480, min: 1048576, description: "Largest linked video model file in bytes (from a HEAD on the instance, before the disk check and the download)"}
  # --- paths ---
  - {name: STATE_DIR, components: [instance], type: str, secret: false, required: false, default: "/var/lib/vastcomfy", description: "Persistent state directory"}
  - {name: ENV_FILE_PATH, components: [instance], type: str, secret: false, required: false, default: "/etc/vastcomfy/.env", description: "Where bootstrap writes the instance .env"}
  - {name: REPO_DIR, components: [instance], type: str, secret: false, required: false, default: "/opt/vast-comfy", description: "Where the repo is cloned"}
  - {name: COMFY_DIR, components: [instance], type: str, secret: false, required: false, default: "/workspace/ComfyUI", description: "ComfyUI install directory (S1)"}
  - {name: WORKFLOWS_DIR, components: [instance], type: str, secret: false, required: false, default: "/workspace/ComfyUI/user/default/workflows", description: "ComfyUI user workflows directory (S1)"}
  - {name: SUPERVISOR_CONF, components: [instance], type: str, secret: false, required: false, default: "/etc/supervisor/supervisord.conf", description: "Config of the supervisord the image already runs; we never start a second one (S1)"}
  - {name: SUPERVISOR_CONF_DIR, components: [instance], type: str, secret: false, required: false, default: "/etc/supervisor/conf.d", description: "Directory of the image supervisord program files; the rendered programs file is written here (S1)"}
  - {name: SUPERVISOR_PROGRAMS_FILE, components: [instance], type: str, secret: false, required: false, default: "vastcomfy.conf", description: "File name, inside SUPERVISOR_CONF_DIR, of the rendered tailscaled and agent programs (S1)"}
  - {name: VENV_DIR, components: [instance], type: str, secret: false, required: false, default: "/opt/vastcomfy-venv", description: "Virtualenv that holds the agent and the pinned vastai CLI; the image venv is left untouched (S1)"}
  # --- network ---
  - {name: COMFY_HOST, components: [instance], type: str, secret: false, required: false, default: "127.0.0.1", description: "ComfyUI bind/connect host"}
  - {name: COMFY_PORT, components: [instance, apps], type: int, secret: false, required: false, default: 18188, description: "ComfyUI port; the image comfyui supervisor program listens on 18188 (S1)"}
  - {name: COMFY_PREVIEW_METHOD, components: [instance, apps], type: str, secret: false, required: false, default: "latent2rgb", choices: [none, latent2rgb, taesd, auto], description: "ComfyUI --preview-method for the step-by-step previews the web page shows while an image is made: latent2rgb needs no extra model (rough colours), taesd needs a TAESD decoder in models/vae_approx (not shipped), none turns previews off. The web passes it to the instance; boot writes it into the image's ComfyUI arguments before the ComfyUI restart"}
  - {name: AGENT_HOST, components: [instance], type: str, secret: false, required: false, default: "127.0.0.1", description: "Agent bind host"}
  - {name: AGENT_PORT, components: [instance, apps], type: int, secret: false, required: false, default: 8189, description: "Agent port"}
  - {name: HTTP_TIMEOUT_S, components: [instance], type: int, secret: false, required: false, default: 5, min: 1, description: "Timeout for local HTTP calls"}
  - {name: HF_BASE_URL, components: [instance], type: str, secret: false, required: false, default: "https://huggingface.co", description: "Model download host"}
  - {name: GIT_HOST_URL, components: [instance], type: str, secret: false, required: false, default: "https://github.com", description: "Host used to clone custom nodes"}
  # --- binaries ---
  - {name: VASTAI_BIN, components: [instance], type: str, secret: false, required: false, default: "/opt/vastcomfy-venv/bin/vastai", description: "vastai CLI used for self-destroy: the pinned new CLI installed in VENV_DIR; fallback sets STOCK_VASTAI_BIN (S1)"}
  - {name: VASTAI_VERSION, components: [instance], type: str, secret: false, required: false, default: "1.8.3", description: "Pinned vastai CLI version pip-installed into VENV_DIR (S1)"}
  - {name: STOCK_VASTAI_BIN, components: [instance], type: str, secret: false, required: false, default: "/opt/instance-tools/bin/vastai", description: "Deprecated vastai CLI shipped in the image (no -y); fallback when the pinned CLI cannot be installed (S1)"}
  - {name: SUPERVISORCTL_BIN, components: [instance], type: str, secret: false, required: false, default: "supervisorctl", description: "supervisorctl binary"}
  - {name: SUPERVISORD_BIN, components: [instance], type: str, secret: false, required: false, default: "supervisord", description: "supervisord binary"}
  - {name: TAILSCALE_BIN, components: [instance], type: str, secret: false, required: false, default: "/opt/tailscale/tailscale", description: "tailscale CLI binary (pinned tarball installed by bootstrap, S2)"}
  - {name: TAILSCALE_VERSION, components: [instance], type: str, secret: false, required: false, default: "1.104.1", description: "Pinned Tailscale static tarball version installed at boot (S2)"}
  - {name: TAILSCALE_DIR, components: [instance], type: str, secret: false, required: false, default: "/opt/tailscale", description: "Directory the Tailscale tarball is extracted into (S2)"}
  - {name: TAILSCALE_URL_BASE, components: [instance], type: str, secret: false, required: false, default: "https://pkgs.tailscale.com/stable", description: "Base URL of the Tailscale static tarballs (S2)"}
  - {name: TAILSCALE_INSTALL_TIMEOUT_S, components: [instance], type: int, secret: false, required: false, default: 120, description: "Seconds before the Tailscale download is aborted (S2)"}
  - {name: TAILSCALED_BIN, components: [instance], type: str, secret: false, required: false, default: "/opt/tailscale/tailscaled", description: "tailscaled daemon binary (pinned tarball installed by bootstrap, S2)"}
  - {name: COMFY_PYTHON, components: [instance], type: str, secret: false, required: false, default: "/venv/main/bin/python", description: "Python interpreter of the image ComfyUI venv (S1); custom node requirements are installed with its -m pip so they land in the environment ComfyUI runs from"}
  - {name: AGENT_PYTHON, components: [instance], type: str, secret: false, required: false, default: "/opt/vastcomfy-venv/bin/python", description: "Python interpreter of VENV_DIR that runs the agent and the boot CLI (S1)"}
  - {name: NVIDIA_SMI_BIN, components: [instance], type: str, secret: false, required: false, default: "nvidia-smi", description: "nvidia-smi binary"}
  - {name: GIT_BIN, components: [instance], type: str, secret: false, required: false, default: "git", description: "git binary"}
  - {name: COMFY_PROGRAM, components: [instance], type: str, secret: false, required: false, default: "comfyui", description: "supervisord program name of ComfyUI"}
  # --- timing and limits ---
  - {name: IDLE_MINUTES, components: [instance], type: int, secret: false, required: false, default: 30, min: 1, description: "Idle minutes before destroy"}
  - {name: IDLE_WARN_MINUTES, components: [instance], type: int, secret: false, required: false, default: 10, min: 1, description: "Minutes before the idle destroy at which state becomes idle-warning"}
  - {name: FAILSAFE_HOURS, components: [instance], type: int, secret: false, required: false, default: 3, min: 1, max: 24, description: "Default failsafe lifetime"}
  - {name: HARD_CAP_HOURS, components: [instance], type: int, secret: false, required: false, default: 6, min: 1, max: 24, description: "Absolute lifetime cap, never extendable"}
  - {name: FAILSAFE_POLL_S, components: [instance], type: int, secret: false, required: false, default: 30, min: 1, description: "failsafe.sh loop interval"}
  - {name: COMFY_POLL_S, components: [instance], type: int, secret: false, required: false, default: 5, min: 1, description: "Agent runner tick interval"}
  - {name: EXTEND_MAX_IDLE_MIN, components: [instance], type: int, secret: false, required: false, default: 120, min: 1, description: "Max minutes per /extend idle call"}
  - {name: EXTEND_MAX_FAILSAFE_MIN, components: [instance], type: int, secret: false, required: false, default: 180, min: 1, description: "Max minutes per /extend failsafe call"}
  - {name: DESTROY_RETRIES, components: [instance], type: int, secret: false, required: false, default: 5, min: 1, description: "Destroy attempts before destroy_failed"}
  - {name: DESTROY_BACKOFF_S, components: [instance], type: int, secret: false, required: false, default: 120, min: 0, description: "Seconds between destroy attempts"}
  - {name: DESTROY_TIMEOUT_S, components: [instance], type: int, secret: false, required: false, default: 60, min: 1, description: "Timeout of one vastai call"}
  - {name: DESTROY_FAILED_RETRY_S, components: [instance], type: int, secret: false, required: false, default: 300, min: 1, description: "Seconds between agent destroy retries while in destroy_failed"}
  - {name: DESTROY_ASSUME_YES, components: [instance], type: bool, secret: false, required: false, default: true, description: "Add -y to the destroy command (needed by the new vastai CLI, which prints Aborted. without a TTY); the stock CLI in the image does not accept -y, so the fallback sets this to false (S1/S4)"}
  - {name: DESTROY_GONE_MARKERS, components: [instance], type: csv, secret: false, required: false, default: "Failed with error 404: Instance", description: "Output fragments (anywhere in a line) meaning the instance is already gone; the CLI prints 'Failed with error 404: Instance <id> not found.' and exits 0 (S4)"}
  - {name: DESTROY_OK_MARKERS, components: [instance], type: csv, secret: false, required: false, default: "destroying instance", description: "Prefixes a non-blank output line must START with to mean the destroy was accepted (leading WARNING lines of the stock CLI are tolerated; a Failed with error line that is not a gone marker always fails); the CLI prints 'destroying instance <id>.' and always exits 0 (S4)"}
  - {name: DOWNLOAD_RETRIES, components: [instance], type: int, secret: false, required: false, default: 3, min: 1, description: "Download attempts per file"}
  - {name: DOWNLOAD_BACKOFF_S, components: [instance], type: int, secret: false, required: false, default: 5, min: 0, description: "Seconds between download attempts"}
  - {name: DOWNLOAD_CHUNK_BYTES, components: [instance], type: int, secret: false, required: false, default: 1048576, min: 1, description: "Download chunk size"}
  - {name: DOWNLOAD_CONNECTIONS, components: [instance, apps], type: int, secret: false, required: false, default: 4, min: 1, max: 16, description: "Parallel byte-range connections per model file when the server answers HEAD with Accept-Ranges: bytes and the pinned size (else one stream); 1 is the old single stream. Files under 16 MiB use one. The web passes it to the instance"}
  - {name: NET_PROBE_BYTES, components: [instance, apps], type: int, secret: false, required: false, default: 50331648, min: 2097152, description: "Bytes of the profile's largest pinned model file the instance reads at the very start of its boot (step net_probe), in two halves over one connection; only the second half is timed (the first pays for TCP slow start). The web passes it to the instance; bootstrap reads it before the schema can be read, with this default"}
  - {name: NET_PROBE_MIN_MBPS, components: [instance, apps], type: int, secret: false, required: false, default: 6, min: 0, description: "Slowest speed in MB/s (10^6 bytes per second) the early network probe accepts; below it twice (5 s apart) the instance destroys itself (failure slow_network) before anything heavy runs. Never on a container restart or with every model already present. 0 turns the probe off. A healthy boot measured about 55 MB/s, the slow one of 2026-10-19 about 2.8. The web passes it to the instance"}
  - {name: DISK_MARGIN_MB, components: [instance], type: int, secret: false, required: false, default: 2048, min: 0, description: "Free disk to keep after downloads"}
  - {name: WORKFLOW_MAX_BYTES, components: [instance], type: int, secret: false, required: false, default: 1048576, min: 1, description: "Max accepted workflow size"}
  - {name: COMFY_START_TIMEOUT_S, components: [instance], type: int, secret: false, required: false, default: 300, min: 1, description: "Wait for ComfyUI to answer"}
  - {name: AGENT_START_TIMEOUT_S, components: [instance], type: int, secret: false, required: false, default: 60, min: 1, description: "Wait for the agent to answer"}
  - {name: SUPERVISOR_WAIT_S, components: [instance], type: int, secret: false, required: false, default: 120, min: 1, description: "Seconds bootstrap waits for the image supervisord (started in the background by the entrypoint) to answer supervisorctl pid before supervisor_failed (S1)"}
  # --- apps (homelab, sub-projects 2-3; listed so the schema is the single registry) ---
  - {name: VAST_API_KEY, components: [apps], type: str, secret: true, required: true, default: null, description: "Main Vast API key, lives on the homelab only"}
  - {name: VAST_API_URL, components: [apps], type: str, secret: false, required: false, default: "https://console.vast.ai/api/v0", description: "Vast REST API base URL"}
  - {name: VAST_CREDIT_CACHE_S, components: [apps], type: int, secret: false, required: false, default: 60, min: 5, description: "Seconds the web process reuses the Vast account credit it read (the admin page asks about once a minute; every read is one extra Vast API call)"}
  - {name: TS_API_CREDENTIAL, components: [apps], type: str, secret: true, required: false, default: null, description: "Tailscale OAuth credential used to mint auth keys"}
  - {name: DISCORD_BOT_TOKEN, components: [apps], type: str, secret: true, required: false, default: null, description: "Discord bot token"}
  - {name: DISCORD_ADMIN_USER_IDS, components: [apps], type: csv, secret: false, required: false, default: "", description: "Discord user ids allowed to start/destroy/extend"}
  - {name: DISCORD_ALERT_TARGET, components: [apps], type: str, secret: false, required: false, default: null, description: "Channel or user that receives alerts"}
  - {name: OUTPUT_DIR, components: [apps], type: str, secret: false, required: false, default: "output", description: "Where saved generations are written"}
  - {name: WATCHDOG_INTERVAL_S, components: [apps], type: int, secret: false, required: false, default: 180, description: "Watchdog polling interval"}
  - {name: BOOT_TIMEOUT_MIN, components: [apps], type: int, secret: false, required: false, default: 25, description: "Destroy an instance that is not ready after this long"}
  - {name: VAST_START_STUCK_MIN, components: [apps], type: int, secret: false, required: false, default: 5, min: 1, description: "Release a booting instance whose container does not run (exited or stopped, created with a stopped intent or state, or a stopped intent without status) once it is this old and that held on two consecutive reconciles at least a minute apart; must be less than BOOT_TIMEOUT_MIN. An image still loading or created with a running intent only meets BOOT_TIMEOUT_MIN"}
  - {name: VAST_BAD_MACHINE_TTL_MIN, components: [apps], type: int, secret: false, required: false, default: 60, min: 1, description: "Starts, estimates and the GPU list skip a Vast machine for this long after its start was released because the container never started (start_stuck), the boot was too slow (slow_boot, slow_download) or the instance disappeared during its boot without the web asking and without a reason that is not the machine's (boot_failed); kept in the usage file"}
  - {name: BOOT_AGENT_GRACE_MIN, components: [apps], type: int, secret: false, required: false, default: 10, min: 2, description: "Release a booting instance (slow_boot) that Vast reports running but whose agent has never answered for this long, counted from the first reconcile that saw the container running (an image pull does not count), confirmed on two consecutive reconciles; must be less than BOOT_TIMEOUT_MIN. A healthy agent answers within about 2-3 minutes of the start"}
  - {name: MODEL_ETA_MIN_OBSERVE_S, components: [apps], type: int, secret: false, required: false, default: 120, min: 1, description: "Seconds the web watches the model download (overall bytes from the agent status, sampled by the reconcile) before it judges the download speed"}
  - {name: BOOT_MAX_DOWNLOAD_ETA_MIN, components: [apps], type: int, secret: false, required: false, default: 20, min: 1, description: "Release a booting instance (slow_download) whose model download, at the average speed seen since the web started watching it, would still need more than this many minutes (or would end after BOOT_TIMEOUT_MIN), when that held on two consecutive reconciles at least a minute apart (about 15 GB at 20 min is about 12.5 MB/s)"}
  - {name: UNREACHABLE_WARN_MIN, components: [apps], type: int, secret: false, required: false, default: 10, description: "Warn when /status is unreachable this long"}
  - {name: UNREACHABLE_DESTROY_MIN, components: [apps], type: int, secret: false, required: false, default: 15, description: "Destroy when /status is unreachable this long"}
  - {name: ALERT_REPEAT_MIN, components: [apps], type: int, secret: false, required: false, default: 5, description: "Repeat urgent alerts at this interval"}
  # --- web interface (sub-project 3a) ---
  - {name: WEB_PORT, components: [apps], type: int, secret: false, required: false, default: 3000, min: 1, max: 65535, description: "Port the web process listens on"}
  - {name: WEB_REPO_DIR, components: [apps], type: str, secret: false, required: false, default: ".", description: "Directory that contains instance/profiles and instance/workflows for the web process"}
  - {name: WEB_ADMIN_GROUP, components: [apps], type: str, secret: false, required: false, default: "authentik Admins", description: "Authentik group allowed to start, extend and destroy"}
  - {name: WEB_MEMBER_GROUP, components: [apps], type: str, secret: false, required: false, default: "member", description: "Authentik group allowed to generate and read status"}
  - {name: AUTHENTIK_ISSUER, components: [apps], type: str, secret: false, required: false, default: "", description: "OIDC issuer of the web app's Authentik provider (https://<authentik>/application/o/<slug>/); discovery and the ID token iss must match it exactly"}
  - {name: AUTHENTIK_CLIENT_ID, components: [apps], type: str, secret: false, required: false, default: "", description: "OIDC client id of the web app's Authentik provider; also the required audience of its ID tokens"}
  - {name: AUTHENTIK_CLIENT_SECRET, components: [apps], type: str, secret: true, required: false, default: "", description: "OIDC client secret of the web app's Authentik provider, used only for the server-side code exchange"}
  - {name: WEB_PUBLIC_URL, components: [apps], type: str, secret: false, required: false, default: "", description: "Public origin of the web app (https, or http only for localhost/127.0.0.1); the OIDC redirect_uri is this origin plus /auth/callback"}
  - {name: WEB_SESSION_SECRET, components: [apps], type: str, secret: true, required: false, default: "", description: "Key (at least 32 bytes) that signs the session and login-transaction cookies"}
  - {name: WEB_SESSION_TTL_H, components: [apps], type: int, secret: false, required: false, default: 8, min: 1, max: 168, description: "Hours a login session cookie stays valid"}
  - {name: WEB_OIDC_SKEW_S, components: [apps], type: int, secret: false, required: false, default: 0, min: 0, max: 120, description: "Clock skew in seconds tolerated when checking ID token times"}
  - {name: REGISTRY_PATH, components: [apps], type: str, secret: false, required: false, default: "registry.json", description: "File that holds the single active instance record"}
  - {name: VAST_IMAGE, components: [apps], type: str, secret: false, required: false, default: "vastai/comfy:v0.41.0-cuda-12.9-py312", description: "Docker image rented on Vast"}
  - {name: VAST_DISK_GB, components: [apps], type: int, secret: false, required: false, default: 50, min: 1, description: "Disk size in GB requested for the instance (an image-only boot). A later on-demand download of the video model files needs room for them on this disk too"}
  - {name: VAST_VIDEO_DISK_GB, components: [apps], type: int, secret: false, required: false, default: 80, min: 1, description: "Disk size in GB requested (and searched for) when the Start dialog's Include video models is ticked; the larger of this and VAST_DISK_GB is used. Read only for such a start"}
  - {name: VAST_MIN_VRAM_GB, components: [apps], type: int, secret: false, required: false, default: 24, min: 1, description: "Minimum GPU VRAM in GB when searching offers"}
  - {name: VAST_MAX_DPH, components: [apps], type: str, secret: false, required: false, default: "0.50", description: "Maximum price in USD per hour for an offer (decimal text)"}
  - {name: VAST_MIN_DOWNLOAD_MBPS, components: [apps], type: int, secret: false, required: false, default: 500, min: 1, description: "Minimum download bandwidth in Mbps for an offer"}
  - {name: START_OFFER_LIST_MAX, components: [apps], type: int, secret: false, required: false, default: 8, min: 1, max: 20, description: "How many offers the Start dialog lists when an admin opens the advanced server choice (after the VAST_* limits, the bad-machine list and the filters)"}
  - {name: VAST_MIN_RELIABILITY, components: [apps], type: str, secret: false, required: false, default: "0.98", description: "Minimum host reliability between 0 and 1 (decimal text)"}
  - {name: VAST_ALLOWED_GPUS, components: [apps], type: csv, secret: false, required: false, default: "RTX A5000,RTX 3090,RTX 4090", description: "GPU models Start may rent and the admin may choose from (Ampere or newer; the image's CUDA 12.9 PyTorch does not support Pascal or Volta). Underscores count as spaces, case is kept. Empty is refused (no_gpu_configured), never any GPU"}
  - {name: TS_AUTHKEY_FILE, components: [apps], type: str, secret: false, required: false, default: "", description: "File holding the manually created Tailscale auth key passed to new instances (used only when no Tailscale OAuth client is configured)"}
  - {name: TS_OAUTH_CLIENT_ID, components: [apps], type: str, secret: true, required: false, default: "", description: "Tailscale OAuth client id (scope auth_keys write, tag tag:gpu); with TS_OAUTH_CLIENT_SECRET every Start mints its own auth key and TS_AUTHKEY_FILE is ignored"}
  - {name: TS_OAUTH_CLIENT_SECRET, components: [apps], type: str, secret: true, required: false, default: "", description: "Tailscale OAuth client secret; set both OAuth keys or neither (exactly one set refuses Start with ts_key_mint_failed)"}
  - {name: TS_OAUTH_TAG, components: [apps], type: str, secret: false, required: false, default: "tag:gpu", description: "The only tag a minted auth key carries (the OAuth client must own it)"}
  - {name: TS_KEY_TTL_S, components: [apps], type: int, secret: false, required: false, default: 3600, min: 1, max: 86400, description: "Expiry in seconds of a minted auth key (single-use, ephemeral, pre-approved); retried once with 86400 if Tailscale rejects it"}
  - {name: TS_RETRY_TOTAL_S, components: [apps], type: int, secret: false, required: false, default: 15, min: 1, max: 120, description: "Overall budget in seconds for minting one Tailscale auth key; network errors, timeouts and 5xx answers of the token and key requests are retried (at most 3 attempts, 1 s then 2 s back-off plus jitter) while it lasts, 4xx answers never"}
  - {name: TS_API_URL, components: [apps], type: str, secret: false, required: false, default: "https://api.tailscale.com", description: "Tailscale API base URL (https; plain http only on a loopback host)"}
  - {name: START_IDLE_MINUTES, components: [apps], type: int, secret: false, required: false, default: 30, min: 1, description: "IDLE_MINUTES passed to a new instance"}
  - {name: START_FAILSAFE_HOURS, components: [apps], type: int, secret: false, required: false, default: 3, min: 1, max: 24, description: "FAILSAFE_HOURS passed to a new instance"}
  - {name: START_HARD_CAP_HOURS, components: [apps], type: int, secret: false, required: false, default: 6, min: 1, max: 24, description: "HARD_CAP_HOURS passed to a new instance"}
  - {name: STATUS_POLL_S, components: [apps], type: int, secret: false, required: false, default: 5, min: 1, description: "Interval between instance status polls"}
  - {name: RECONCILE_INTERVAL_S, components: [apps], type: int, secret: false, required: false, default: 60, min: 1, description: "Interval between registry versus Vast reconciliations"}
  - {name: GENERATE_MAX_PROMPT_CHARS, components: [apps], type: int, secret: false, required: false, default: 2000, min: 1, description: "Maximum prompt length accepted by generate"}
  - {name: GENERATE_MAX_NEGATIVE_PROMPT_CHARS, components: [apps], type: int, secret: false, required: false, default: 1000, min: 1, max: 4000, description: "Maximum negative prompt length accepted by generate and edit (after trimming); a style default negative prompt longer than this stops the server at startup"}
  - {name: GENERATE_TIMEOUT_S, components: [apps], type: int, secret: false, required: false, default: 600, min: 1, description: "Seconds before a generation is given up"}
  - {name: HTTP_TIMEOUT_S_APPS, components: [apps], type: int, secret: false, required: false, default: 10, min: 1, description: "Timeout of outbound HTTP calls from the web process"}
  - {name: START_RATE_LIMIT_PER_HOUR, components: [apps], type: int, secret: false, required: false, default: 3, min: 1, description: "Maximum Start requests per hour"}
  - {name: RECONCILE_GRACE_MIN, components: [apps], type: int, secret: false, required: false, default: 10, min: 1, description: "Minutes after a record is created during which reconcile leaves it alone when Vast does not (yet) list its instance; after that a creating record without an instance, or a record whose instance vanished, becomes gone"}
  - {name: WEB_DESTROY_RETRIES, components: [apps], type: int, secret: false, required: false, default: 3, min: 1, description: "Vast destroy attempts per web destroy or reconcile cycle before reporting destroy_failed"}
  - {name: WEB_DESTROY_BACKOFF_S, components: [apps], type: int, secret: false, required: false, default: 5, min: 0, description: "Seconds between Vast destroy attempts made by the web process"}
  - {name: WEB_HOST, components: [apps], type: str, secret: false, required: false, default: "0.0.0.0", description: "Address the web process listens on (all interfaces inside its container)"}
  - {name: WEB_BODY_LIMIT_BYTES, components: [apps], type: int, secret: false, required: false, default: 16384, min: 1024, max: 1048576, description: "Maximum request body size accepted by the web API"}
  - {name: WEB_JOB_CACHE_MAX, components: [apps], type: int, secret: false, required: false, default: 200, min: 1, description: "Maximum generate jobs the web process remembers (oldest are forgotten first)"}
  - {name: WEB_JOB_TTL_S, components: [apps], type: int, secret: false, required: false, default: 3600, min: 60, description: "Seconds a generate job (and access to its images) is remembered"}
  - {name: WEB_EXTEND_MAX_MINUTES, components: [apps], type: int, secret: false, required: false, default: 360, min: 1, description: "Largest extension in minutes one Extend request may ask for (the agent still enforces the hard cap)"}
  - {name: WEB_GENERATE_RATE_LIMIT_PER_HOUR, components: [apps], type: int, secret: false, required: false, default: 60, min: 1, description: "Maximum Generate requests per hour per identity"}
  - {name: WEB_IMAGE_MAX_BYTES, components: [apps], type: int, secret: false, required: false, default: 33554432, min: 1024, description: "Largest image body the web process reads from ComfyUI /view; reading stops as soon as it is exceeded"}
  - {name: WEB_IMAGE_TIMEOUT_S, components: [apps], type: int, secret: false, required: false, default: 60, min: 1, description: "Timeout of one ComfyUI /view image download or /upload/image reference upload, and of one gallery object-store request, by the web process (JSON calls keep HTTP_TIMEOUT_S_APPS)"}
  - {name: WEB_JSON_MAX_BYTES, components: [apps], type: int, secret: false, required: false, default: 2097152, min: 1024, description: "Largest JSON body the web process reads from the instance (ComfyUI /prompt, /history, /queue and agent calls)"}
  - {name: WEB_PROGRESS_ENABLED, components: [apps], type: bool, secret: false, required: false, default: true, description: "Open ComfyUI's websocket for each job to show the step counter and the live preview; false turns both off (jobs work as before)"}
  - {name: WEB_PREVIEW_MAX_BYTES, components: [apps], type: int, secret: false, required: false, default: 524288, min: 1024, description: "Largest live preview image the web process keeps per job (only the newest one is kept); a larger websocket message closes the job's socket"}
  - {name: WEB_PROGRESS_MESSAGE_MAX_BYTES, components: [apps], type: int, secret: false, required: false, default: 65536, min: 1024, description: "Largest JSON message accepted on a job's ComfyUI websocket; a larger one closes that socket"}
  - {name: GALLERY_S3_ENDPOINT, components: [apps], type: str, secret: false, required: false, default: "", description: "Base URL of the S3-compatible server (MinIO) that stores saved images; empty turns Save and the gallery off"}
  - {name: GALLERY_S3_BUCKET, components: [apps], type: str, secret: false, required: false, default: "vast-gallery", description: "Bucket of saved images; it stays private (images are served through the web service)"}
  - {name: GALLERY_S3_REGION, components: [apps], type: str, secret: false, required: false, default: "us-east-1", description: "Region used to sign S3 requests (MinIO accepts the default)"}
  - {name: GALLERY_S3_ACCESS_KEY, components: [apps], type: str, secret: true, required: false, default: "", description: "Access key of a user that may only use the gallery bucket"}
  - {name: GALLERY_S3_SECRET_KEY, components: [apps], type: str, secret: true, required: false, default: "", description: "Secret key of that user"}
  - {name: GALLERY_MAX_IMAGES_PER_USER, components: [apps], type: int, secret: false, required: false, default: 300, min: 1, description: "Most images one member may keep in the gallery; Save is refused above it (gallery_quota)"}
  - {name: GALLERY_MAX_BYTES_PER_USER, components: [apps], type: int, secret: false, required: false, default: 2147483648, min: 1048576, description: "Most bytes one member may keep in the gallery; Save is refused above it (gallery_quota)"}
  - {name: GALLERY_PAGE_SIZE, components: [apps], type: int, secret: false, required: false, default: 12, min: 1, max: 100, description: "Images per gallery page"}
  - {name: GALLERY_SAVE_RATE_LIMIT_PER_HOUR, components: [apps], type: int, secret: false, required: false, default: 120, min: 1, description: "Gallery saves (POST /api/gallery) one member may make per hour, counted per identity; more are refused (rate_limited)"}
  - {name: GALLERY_MAX_CONCURRENT, components: [apps], type: int, secret: false, required: false, default: 3, min: 1, max: 32, description: "Gallery saves and image reads handled at the same time; the others wait. Each holds one image of up to WEB_IMAGE_MAX_BYTES in memory, so this bounds the gallery's memory use"}
  - {name: GALLERY_ADMIN_SCAN_MAX, components: [apps], type: int, secret: false, required: false, default: 5000, min: 100, max: 100000, description: "Most object keys read for one page when an admin lists everyone's images (member folders included). Each member folder costs GALLERY_PAGE_SIZE + 2, so the view merges floor(GALLERY_ADMIN_SCAN_MAX / (GALLERY_PAGE_SIZE + 2)) members, complete and newest first; members beyond that (in folder order, a hash of the login) are left out"}
  - {name: EDIT_MAX_REFERENCES, components: [apps], type: int, secret: false, required: false, default: 4, min: 1, max: 10, description: "Maximum reference images one edit request may carry (the Qwen-Image 2.1 edit template supports 10)"}
  - {name: EDIT_REFERENCE_MAX_BYTES, components: [apps], type: int, secret: false, required: false, default: 8388608, min: 1024, max: 33554432, description: "Largest decoded size in bytes of one reference image; the edit route body limit is derived from this and EDIT_MAX_REFERENCES"}
  - {name: EDIT_REFERENCE_MAX_PIXELS, components: [apps], type: int, secret: false, required: false, default: 16777216, min: 1024, description: "Largest width times height of one reference image (read from its header before it is sent to the instance)"}
  - {name: EDIT_REFERENCE_MAX_SIDE, components: [apps], type: int, secret: false, required: false, default: 8192, min: 64, description: "Largest width or height in pixels of one reference image (read from its header before it is sent to the instance)"}
  - {name: EDIT_REFERENCE_TYPES, components: [apps], type: csv, secret: false, required: false, default: "png,jpeg,webp", description: "Image types accepted as references, detected by magic bytes (png, jpeg, webp)"}
  - {name: UPSCALE_MAX_OUTPUT_PIXELS, components: [apps], type: int, secret: false, required: false, default: 33554432, min: 1024, description: "Largest width times height of an upscale result; computed from the input header and the chosen scale before anything is sent to the instance"}
  - {name: UPSCALE_MAX_INTERMEDIATE_PIXELS, components: [apps], type: int, secret: false, required: false, default: 33554432, min: 1024, description: "Largest width times height of the upscale model's own output (input times model_factor squared), which ImageUpscaleWithModel always makes before the scale trims it; checked with UPSCALE_MAX_OUTPUT_PIXELS before anything is sent"}
  - {name: VIDEO_TIMEOUT_S, components: [apps], type: int, secret: false, required: false, default: 2400, min: 60, description: "Seconds before a video job is given up (a clip takes many minutes; image jobs keep GENERATE_TIMEOUT_S). Must be shorter than WEB_JOB_TTL_S, or the web app refuses to start while video is on. Read only when the profile enables video"}
  - {name: VIDEO_MAX_BYTES, components: [apps], type: int, secret: false, required: false, default: 104857600, min: 1024, description: "Largest result video the web process reads from ComfyUI /view; reading stops as soon as it is exceeded and the video is refused. Read only when the profile enables video"}
  - {name: VIDEO_VIEW_TIMEOUT_S, components: [apps], type: int, secret: false, required: false, default: 300, min: 1, description: "Timeout of one ComfyUI /view download of a result video by the web process (images keep WEB_IMAGE_TIMEOUT_S). Read only when the profile enables video"}
  - {name: WEB_REQUEST_TIMEOUT_S, components: [apps], type: int, secret: false, required: false, default: 30, min: 1, description: "Seconds a client may take to send a whole request to the web process"}
  - {name: WEB_CONNECTION_TIMEOUT_S, components: [apps], type: int, secret: false, required: false, default: 60, min: 1, description: "Seconds of socket inactivity before the web process closes a connection"}
  - {name: WEB_KEEPALIVE_TIMEOUT_S, components: [apps], type: int, secret: false, required: false, default: 75, min: 1, description: "Seconds an idle keep-alive connection to the web process stays open"}
  - {name: WEB_SHUTDOWN_WAIT_S, components: [apps], type: int, secret: false, required: false, default: 15, min: 1, description: "Seconds the web process waits for an in-flight reconcile when shutting down"}
  - {name: BOOT_LOG_PATH, components: [apps], type: str, secret: false, required: false, default: "boot-console.json", description: "File that keeps the boot console lines (masked) across web restarts; relative paths resolve like REGISTRY_PATH, and compose puts it on the data volume next to the registry"}
  - {name: BOOT_LOG_MAX_LINES, components: [apps], type: int, secret: false, required: false, default: 500, min: 10, max: 10000, description: "Lines the boot console keeps (oldest are dropped first)"}
  - {name: BOOT_LOG_MAX_LINE_CHARS, components: [apps], type: int, secret: false, required: false, default: 400, min: 40, max: 4000, description: "Characters kept per boot console line (masked first, then cut)"}
  - {name: BOOT_LOG_POLL_MIN_S, components: [apps], type: int, secret: false, required: false, default: 5, min: 1, description: "Minimum seconds between two Vast reads (instance list and container logs) for the boot console"}
  - {name: BOOT_LOG_WATCH_S, components: [apps], type: int, secret: false, required: false, default: 60, min: 1, description: "Seconds after the last GET /api/console during which the status poll may also read Vast logs; with nobody watching no log request is made"}
  - {name: BOOT_LOG_MAX_BYTES, components: [apps], type: int, secret: false, required: false, default: 1048576, min: 1024, max: 16777216, description: "Largest Vast container log download read for the boot console; reading stops there and the partial last line is dropped"}
  - {name: BOOT_LOG_TAIL_LINES, components: [apps], type: int, secret: false, required: false, default: 300, min: 10, max: 5000, description: "Lines requested from the end of the Vast container log on each boot console read"}
  - {name: LORA_STORE_PATH, components: [apps], type: str, secret: false, required: false, default: "extra-loras.json", description: "File that keeps the extra LoRAs admins add by link (Video tool, Manage LoRAs); relative paths resolve like REGISTRY_PATH, and compose puts it on the data volume next to the registry. A file that cannot be read is never overwritten (adding is then refused until it is fixed or removed)"}
  - {name: LORA_MAX_ENTRIES, components: [apps], type: int, secret: false, required: false, default: 20, min: 1, description: "Most extra LoRAs admins can add by link"}
  - {name: LORA_WRITE_RATE_LIMIT_PER_HOUR, components: [apps], type: int, secret: false, required: false, default: 30, min: 1, description: "Adds, changes and deletes of extra LoRAs per admin per hour"}
  - {name: LORA_SYNC_MIN_INTERVAL_S, components: [apps], type: int, secret: false, required: false, default: 30, min: 1, description: "Least seconds between two syncs of the extra LoRA set to the instance triggered by the state poll (an add or a delete syncs at once)"}
  - {name: USAGE_LOG_PATH, components: [apps], type: str, secret: false, required: false, default: "usage-history.json", description: "File that keeps the usage history (when each instance started and stopped, and why) across web restarts; relative paths resolve like REGISTRY_PATH, and compose puts it on the data volume next to the registry"}
  - {name: USAGE_LOG_MAX_ENTRIES, components: [apps], type: int, secret: false, required: false, default: 200, min: 2, max: 10000, description: "Sessions the usage history keeps (the oldest ended ones are dropped first)"}
  - {name: USAGE_REASON_SLACK_S, components: [apps], type: int, secret: false, required: false, default: 120, min: 0, max: 3600, description: "Seconds an agent deadline (idle, failsafe, hard cap) may lie after the moment the web noticed the instance was gone and still count as the reason it stopped (clock skew between the instance and the web)"}
