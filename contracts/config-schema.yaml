version: 1
keys:
  # --- credentials injected by Vast or by the bot (instance) ---
  - {name: CONTAINER_ID, components: [instance], type: str, secret: false, required: true, default: null, description: "Vast instance id (injected by Vast)"}
  - {name: CONTAINER_API_KEY, components: [instance], type: str, secret: true, required: true, default: null, description: "Per-instance Vast key, can only manage its own instance (injected by Vast)"}
  - {name: AGENT_TOKEN, components: [instance], type: str, secret: true, required: true, default: null, description: "Bearer token for the agent API, one per instance (created by the bot)"}
  - {name: TS_AUTHKEY, components: [instance], type: str, secret: true, required: false, default: "", description: "Single-use Tailscale auth key, blanked after use"}
  - {name: HF_TOKEN, components: [instance], type: str, secret: true, required: false, default: "", description: "Optional Hugging Face token for model downloads"}
  # --- identity and bootstrap inputs (instance) ---
  - {name: TS_HOSTNAME, components: [instance], type: str, secret: false, required: true, default: null, description: "Unique tailnet hostname for this instance"}
  - {name: TS_TAG, components: [instance], type: str, secret: false, required: false, default: "tag:gpu", description: "Tailscale tag advertised by the instance"}
  - {name: TS_SOCKET, components: [instance], type: str, secret: false, required: false, default: "/var/run/tailscale/tailscaled.sock", description: "tailscaled socket path"}
  - {name: REPO_URL, components: [instance, apps], type: str, secret: false, required: true, default: null, description: "Git URL of this repository"}
  - {name: REPO_COMMIT, components: [instance, apps], type: str, secret: false, required: true, default: null, description: "Pinned commit that bootstrap checks out"}
  - {name: PROFILE, components: [instance, apps], type: str, secret: false, required: true, default: null, description: "Profile name, e.g. image"}
  - {name: KEEP_ON_FAILURE, components: [instance], type: bool, secret: false, required: false, default: false, description: "Do not self-destroy on boot failure (debugging only)"}
  # --- paths ---
  - {name: STATE_DIR, components: [instance], type: str, secret: false, required: false, default: "/var/lib/vastcomfy", description: "Persistent state directory"}
  - {name: ENV_FILE_PATH, components: [instance], type: str, secret: false, required: false, default: "/etc/vastcomfy/.env", description: "Where bootstrap writes the instance .env"}
  - {name: REPO_DIR, components: [instance], type: str, secret: false, required: false, default: "/opt/vast-comfy", description: "Where the repo is cloned"}
  - {name: COMFY_DIR, components: [instance], type: str, secret: false, required: false, default: "/workspace/ComfyUI", description: "ComfyUI install directory (S1)"}
  - {name: WORKFLOWS_DIR, components: [instance], type: str, secret: false, required: false, default: "/workspace/ComfyUI/user/default/workflows", description: "ComfyUI user workflows directory (S1)"}
  - {name: SUPERVISOR_CONF, components: [instance], type: str, secret: false, required: false, default: "/etc/supervisor/supervisord.conf", description: "Config of the supervisord the image already runs; we never start a second one (S1)"}
  - {name: SUPERVISOR_CONF_DIR, components: [instance], type: str, secret: false, required: false, default: "/etc/supervisor/conf.d", description: "Directory of the image supervisord program files; the rendered programs file is written here (S1)"}
  - {name: SUPERVISOR_PROGRAMS_FILE, components: [instance], type: str, secret: false, required: false, default: "vastcomfy.conf", description: "File name, inside SUPERVISOR_CONF_DIR, of the rendered tailscaled and agent programs (S1)"}
  - {name: VENV_DIR, components: [instance], type: str, secret: false, required: false, default: "/opt/vastcomfy-venv", description: "Virtualenv that holds the agent and the pinned vastai CLI; the image venv is left untouched (S1)"}
  # --- network ---
  - {name: COMFY_HOST, components: [instance], type: str, secret: false, required: false, default: "127.0.0.1", description: "ComfyUI bind/connect host"}
  - {name: COMFY_PORT, components: [instance, apps], type: int, secret: false, required: false, default: 18188, description: "ComfyUI port; the image comfyui supervisor program listens on 18188 (S1)"}
  - {name: AGENT_HOST, components: [instance], type: str, secret: false, required: false, default: "127.0.0.1", description: "Agent bind host"}
  - {name: AGENT_PORT, components: [instance, apps], type: int, secret: false, required: false, default: 8189, description: "Agent port"}
  - {name: HTTP_TIMEOUT_S, components: [instance], type: int, secret: false, required: false, default: 5, min: 1, description: "Timeout for local HTTP calls"}
  - {name: HF_BASE_URL, components: [instance], type: str, secret: false, required: false, default: "https://huggingface.co", description: "Model download host"}
  - {name: GIT_HOST_URL, components: [instance], type: str, secret: false, required: false, default: "https://github.com", description: "Host used to clone custom nodes"}
  # --- binaries ---
  - {name: VASTAI_BIN, components: [instance], type: str, secret: false, required: false, default: "/opt/vastcomfy-venv/bin/vastai", description: "vastai CLI used for self-destroy: the pinned new CLI installed in VENV_DIR; fallback sets STOCK_VASTAI_BIN (S1)"}
  - {name: VASTAI_VERSION, components: [instance], type: str, secret: false, required: false, default: "1.8.3", description: "Pinned vastai CLI version pip-installed into VENV_DIR (S1)"}
  - {name: STOCK_VASTAI_BIN, components: [instance], type: str, secret: false, required: false, default: "/opt/instance-tools/bin/vastai", description: "Deprecated vastai CLI shipped in the image (no -y); fallback when the pinned CLI cannot be installed (S1)"}
  - {name: SUPERVISORCTL_BIN, components: [instance], type: str, secret: false, required: false, default: "supervisorctl", description: "supervisorctl binary"}
  - {name: SUPERVISORD_BIN, components: [instance], type: str, secret: false, required: false, default: "supervisord", description: "supervisord binary"}
  - {name: TAILSCALE_BIN, components: [instance], type: str, secret: false, required: false, default: "/opt/tailscale/tailscale", description: "tailscale CLI binary (pinned tarball installed by bootstrap, S2)"}
  - {name: TAILSCALE_VERSION, components: [instance], type: str, secret: false, required: false, default: "1.104.1", description: "Pinned Tailscale static tarball version installed at boot (S2)"}
  - {name: TAILSCALE_DIR, components: [instance], type: str, secret: false, required: false, default: "/opt/tailscale", description: "Directory the Tailscale tarball is extracted into (S2)"}
  - {name: TAILSCALE_URL_BASE, components: [instance], type: str, secret: false, required: false, default: "https://pkgs.tailscale.com/stable", description: "Base URL of the Tailscale static tarballs (S2)"}
  - {name: TAILSCALE_INSTALL_TIMEOUT_S, components: [instance], type: int, secret: false, required: false, default: 120, description: "Seconds before the Tailscale download is aborted (S2)"}
  - {name: TAILSCALED_BIN, components: [instance], type: str, secret: false, required: false, default: "/opt/tailscale/tailscaled", description: "tailscaled daemon binary (pinned tarball installed by bootstrap, S2)"}
  - {name: COMFY_PYTHON, components: [instance], type: str, secret: false, required: false, default: "/venv/main/bin/python", description: "Python interpreter of the image ComfyUI venv (S1)"}
  - {name: AGENT_PYTHON, components: [instance], type: str, secret: false, required: false, default: "/opt/vastcomfy-venv/bin/python", description: "Python interpreter of VENV_DIR that runs the agent and the boot CLI (S1)"}
  - {name: NVIDIA_SMI_BIN, components: [instance], type: str, secret: false, required: false, default: "nvidia-smi", description: "nvidia-smi binary"}
  - {name: GIT_BIN, components: [instance], type: str, secret: false, required: false, default: "git", description: "git binary"}
  - {name: PIP_BIN, components: [instance], type: str, secret: false, required: false, default: "pip", description: "pip binary for custom node requirements"}
  - {name: COMFY_PROGRAM, components: [instance], type: str, secret: false, required: false, default: "comfyui", description: "supervisord program name of ComfyUI"}
  # --- timing and limits ---
  - {name: IDLE_MINUTES, components: [instance], type: int, secret: false, required: false, default: 30, min: 1, description: "Idle minutes before destroy"}
  - {name: IDLE_WARN_MINUTES, components: [instance], type: int, secret: false, required: false, default: 10, min: 1, description: "Minutes before the idle destroy at which state becomes idle-warning"}
  - {name: FAILSAFE_HOURS, components: [instance], type: int, secret: false, required: false, default: 3, min: 1, max: 24, description: "Default failsafe lifetime"}
  - {name: HARD_CAP_HOURS, components: [instance], type: int, secret: false, required: false, default: 6, min: 1, max: 24, description: "Absolute lifetime cap, never extendable"}
  - {name: FAILSAFE_POLL_S, components: [instance], type: int, secret: false, required: false, default: 30, min: 1, description: "failsafe.sh loop interval"}
  - {name: COMFY_POLL_S, components: [instance], type: int, secret: false, required: false, default: 5, min: 1, description: "Agent runner tick interval"}
  - {name: EXTEND_MAX_IDLE_MIN, components: [instance], type: int, secret: false, required: false, default: 120, min: 1, description: "Max minutes per /extend idle call"}
  - {name: EXTEND_MAX_FAILSAFE_MIN, components: [instance], type: int, secret: false, required: false, default: 180, min: 1, description: "Max minutes per /extend failsafe call"}
  - {name: DESTROY_RETRIES, components: [instance], type: int, secret: false, required: false, default: 5, min: 1, description: "Destroy attempts before destroy_failed"}
  - {name: DESTROY_BACKOFF_S, components: [instance], type: int, secret: false, required: false, default: 120, min: 0, description: "Seconds between destroy attempts"}
  - {name: DESTROY_TIMEOUT_S, components: [instance], type: int, secret: false, required: false, default: 60, min: 1, description: "Timeout of one vastai call"}
  - {name: DESTROY_FAILED_RETRY_S, components: [instance], type: int, secret: false, required: false, default: 300, min: 1, description: "Seconds between agent destroy retries while in destroy_failed"}
  - {name: DESTROY_ASSUME_YES, components: [instance], type: bool, secret: false, required: false, default: true, description: "Add -y to the destroy command (needed by the new vastai CLI, which prints Aborted. without a TTY); the stock CLI in the image does not accept -y, so the fallback sets this to false (S1/S4)"}
  - {name: DESTROY_GONE_MARKERS, components: [instance], type: csv, secret: false, required: false, default: "Failed with error 404: Instance", description: "Output fragments (anywhere in a line) meaning the instance is already gone; the CLI prints 'Failed with error 404: Instance <id> not found.' and exits 0 (S4)"}
  - {name: DESTROY_OK_MARKERS, components: [instance], type: csv, secret: false, required: false, default: "destroying instance", description: "Prefixes a non-blank output line must START with to mean the destroy was accepted (leading WARNING lines of the stock CLI are tolerated; a Failed with error line that is not a gone marker always fails); the CLI prints 'destroying instance <id>.' and always exits 0 (S4)"}
  - {name: DOWNLOAD_RETRIES, components: [instance], type: int, secret: false, required: false, default: 3, min: 1, description: "Download attempts per file"}
  - {name: DOWNLOAD_BACKOFF_S, components: [instance], type: int, secret: false, required: false, default: 5, min: 0, description: "Seconds between download attempts"}
  - {name: DOWNLOAD_CHUNK_BYTES, components: [instance], type: int, secret: false, required: false, default: 1048576, min: 1, description: "Download chunk size"}
  - {name: DISK_MARGIN_MB, components: [instance], type: int, secret: false, required: false, default: 2048, min: 0, description: "Free disk to keep after downloads"}
  - {name: WORKFLOW_MAX_BYTES, components: [instance], type: int, secret: false, required: false, default: 1048576, min: 1, description: "Max accepted workflow size"}
  - {name: COMFY_START_TIMEOUT_S, components: [instance], type: int, secret: false, required: false, default: 300, min: 1, description: "Wait for ComfyUI to answer"}
  - {name: AGENT_START_TIMEOUT_S, components: [instance], type: int, secret: false, required: false, default: 60, min: 1, description: "Wait for the agent to answer"}
  - {name: SUPERVISOR_WAIT_S, components: [instance], type: int, secret: false, required: false, default: 120, min: 1, description: "Seconds bootstrap waits for the image supervisord (started in the background by the entrypoint) to answer supervisorctl pid before supervisor_failed (S1)"}
  # --- apps (homelab, sub-projects 2-3; listed so the schema is the single registry) ---
  - {name: VAST_API_KEY, components: [apps], type: str, secret: true, required: true, default: null, description: "Main Vast API key, lives on the homelab only"}
  - {name: VAST_API_URL, components: [apps], type: str, secret: false, required: false, default: "https://console.vast.ai/api/v0", description: "Vast REST API base URL"}
  - {name: TS_API_CREDENTIAL, components: [apps], type: str, secret: true, required: false, default: null, description: "Tailscale OAuth credential used to mint auth keys"}
  - {name: DISCORD_BOT_TOKEN, components: [apps], type: str, secret: true, required: false, default: null, description: "Discord bot token"}
  - {name: DISCORD_ADMIN_USER_IDS, components: [apps], type: csv, secret: false, required: false, default: "", description: "Discord user ids allowed to start/destroy/extend"}
  - {name: DISCORD_ALERT_TARGET, components: [apps], type: str, secret: false, required: false, default: null, description: "Channel or user that receives alerts"}
  - {name: OUTPUT_DIR, components: [apps], type: str, secret: false, required: false, default: "output", description: "Where saved generations are written"}
  - {name: WATCHDOG_INTERVAL_S, components: [apps], type: int, secret: false, required: false, default: 180, description: "Watchdog polling interval"}
  - {name: BOOT_TIMEOUT_MIN, components: [apps], type: int, secret: false, required: false, default: 25, description: "Destroy an instance that is not ready after this long"}
  - {name: UNREACHABLE_WARN_MIN, components: [apps], type: int, secret: false, required: false, default: 10, description: "Warn when /status is unreachable this long"}
  - {name: UNREACHABLE_DESTROY_MIN, components: [apps], type: int, secret: false, required: false, default: 15, description: "Destroy when /status is unreachable this long"}
  - {name: ALERT_REPEAT_MIN, components: [apps], type: int, secret: false, required: false, default: 5, description: "Repeat urgent alerts at this interval"}
  # --- web interface (sub-project 3a) ---
  - {name: WEB_PORT, components: [apps], type: int, secret: false, required: false, default: 3000, min: 1, max: 65535, description: "Port the web process listens on"}
  - {name: WEB_REPO_DIR, components: [apps], type: str, secret: false, required: false, default: ".", description: "Directory that contains instance/profiles and instance/workflows for the web process"}
  - {name: WEB_ADMIN_GROUP, components: [apps], type: str, secret: false, required: false, default: "authentik Admins", description: "Authentik group allowed to start, extend and destroy"}
  - {name: WEB_MEMBER_GROUP, components: [apps], type: str, secret: false, required: false, default: "member", description: "Authentik group allowed to generate and read status"}
  - {name: AUTHENTIK_JWKS_URL, components: [apps], type: str, secret: false, required: false, default: "", description: "Authentik JWKS URL used to verify identity tokens"}
  - {name: AUTHENTIK_ISSUER, components: [apps], type: str, secret: false, required: false, default: "", description: "Expected issuer of the Authentik identity token"}
  - {name: AUTHENTIK_AUDIENCE, components: [apps], type: str, secret: false, required: false, default: "", description: "Expected audience of the Authentik identity token"}
  - {name: REGISTRY_PATH, components: [apps], type: str, secret: false, required: false, default: "registry.json", description: "File that holds the single active instance record"}
  - {name: VAST_IMAGE, components: [apps], type: str, secret: false, required: false, default: "vastai/comfy:v0.41.0-cuda-12.9-py312", description: "Docker image rented on Vast"}
  - {name: VAST_DISK_GB, components: [apps], type: int, secret: false, required: false, default: 50, min: 1, description: "Disk size in GB requested for the instance"}
  - {name: VAST_MIN_VRAM_GB, components: [apps], type: int, secret: false, required: false, default: 24, min: 1, description: "Minimum GPU VRAM in GB when searching offers"}
  - {name: VAST_MAX_DPH, components: [apps], type: str, secret: false, required: false, default: "0.50", description: "Maximum price in USD per hour for an offer (decimal text)"}
  - {name: VAST_MIN_DOWNLOAD_MBPS, components: [apps], type: int, secret: false, required: false, default: 500, min: 1, description: "Minimum download bandwidth in Mbps for an offer"}
  - {name: VAST_MIN_RELIABILITY, components: [apps], type: str, secret: false, required: false, default: "0.98", description: "Minimum host reliability between 0 and 1 (decimal text)"}
  - {name: VAST_ALLOWED_GPUS, components: [apps], type: csv, secret: false, required: false, default: "", description: "Allowed GPU names, empty means any"}
  - {name: TS_AUTHKEY_FILE, components: [apps], type: str, secret: false, required: false, default: "", description: "File holding the manually created Tailscale auth key passed to new instances"}
  - {name: START_IDLE_MINUTES, components: [apps], type: int, secret: false, required: false, default: 30, min: 1, description: "IDLE_MINUTES passed to a new instance"}
  - {name: START_FAILSAFE_HOURS, components: [apps], type: int, secret: false, required: false, default: 3, min: 1, max: 24, description: "FAILSAFE_HOURS passed to a new instance"}
  - {name: START_HARD_CAP_HOURS, components: [apps], type: int, secret: false, required: false, default: 6, min: 1, max: 24, description: "HARD_CAP_HOURS passed to a new instance"}
  - {name: STATUS_POLL_S, components: [apps], type: int, secret: false, required: false, default: 5, min: 1, description: "Interval between instance status polls"}
  - {name: RECONCILE_INTERVAL_S, components: [apps], type: int, secret: false, required: false, default: 60, min: 1, description: "Interval between registry versus Vast reconciliations"}
  - {name: GENERATE_MAX_PROMPT_CHARS, components: [apps], type: int, secret: false, required: false, default: 2000, min: 1, description: "Maximum prompt length accepted by generate"}
  - {name: GENERATE_TIMEOUT_S, components: [apps], type: int, secret: false, required: false, default: 600, min: 1, description: "Seconds before a generation is given up"}
  - {name: HTTP_TIMEOUT_S_APPS, components: [apps], type: int, secret: false, required: false, default: 10, min: 1, description: "Timeout of outbound HTTP calls from the web process"}
  - {name: START_RATE_LIMIT_PER_HOUR, components: [apps], type: int, secret: false, required: false, default: 3, min: 1, description: "Maximum Start requests per hour"}
  - {name: RECONCILE_GRACE_MIN, components: [apps], type: int, secret: false, required: false, default: 10, min: 1, description: "Minutes after a record is created during which reconcile leaves it alone when Vast does not (yet) list its instance; after that a creating record without an instance, or a record whose instance vanished, becomes gone"}
  - {name: WEB_DESTROY_RETRIES, components: [apps], type: int, secret: false, required: false, default: 3, min: 1, description: "Vast destroy attempts per web destroy or reconcile cycle before reporting destroy_failed"}
  - {name: WEB_DESTROY_BACKOFF_S, components: [apps], type: int, secret: false, required: false, default: 5, min: 0, description: "Seconds between Vast destroy attempts made by the web process"}
  - {name: WEB_HOST, components: [apps], type: str, secret: false, required: false, default: "0.0.0.0", description: "Address the web process listens on (all interfaces inside its container)"}
  - {name: WEB_BODY_LIMIT_BYTES, components: [apps], type: int, secret: false, required: false, default: 16384, min: 1024, max: 1048576, description: "Maximum request body size accepted by the web API"}
  - {name: WEB_JOB_CACHE_MAX, components: [apps], type: int, secret: false, required: false, default: 200, min: 1, description: "Maximum generate jobs the web process remembers (oldest are forgotten first)"}
  - {name: WEB_JOB_TTL_S, components: [apps], type: int, secret: false, required: false, default: 3600, min: 60, description: "Seconds a generate job (and access to its images) is remembered"}
  - {name: WEB_EXTEND_MAX_MINUTES, components: [apps], type: int, secret: false, required: false, default: 360, min: 1, description: "Largest extension in minutes one Extend request may ask for (the agent still enforces the hard cap)"}
  - {name: WEB_GENERATE_RATE_LIMIT_PER_HOUR, components: [apps], type: int, secret: false, required: false, default: 60, min: 1, description: "Maximum Generate requests per hour per identity"}
  - {name: WEB_IMAGE_MAX_BYTES, components: [apps], type: int, secret: false, required: false, default: 33554432, min: 1024, description: "Largest image body the web process reads from ComfyUI /view; reading stops as soon as it is exceeded"}
  - {name: WEB_JSON_MAX_BYTES, components: [apps], type: int, secret: false, required: false, default: 2097152, min: 1024, description: "Largest JSON body the web process reads from the instance (ComfyUI /prompt, /history, /queue and agent calls)"}
  - {name: WEB_REQUEST_TIMEOUT_S, components: [apps], type: int, secret: false, required: false, default: 30, min: 1, description: "Seconds a client may take to send a whole request to the web process"}
  - {name: WEB_CONNECTION_TIMEOUT_S, components: [apps], type: int, secret: false, required: false, default: 60, min: 1, description: "Seconds of socket inactivity before the web process closes a connection"}
  - {name: WEB_KEEPALIVE_TIMEOUT_S, components: [apps], type: int, secret: false, required: false, default: 75, min: 1, description: "Seconds an idle keep-alive connection to the web process stays open"}
  - {name: WEB_SHUTDOWN_WAIT_S, components: [apps], type: int, secret: false, required: false, default: 15, min: 1, description: "Seconds the web process waits for an in-flight reconcile when shutting down"}
