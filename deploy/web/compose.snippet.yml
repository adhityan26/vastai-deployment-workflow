# Snippet for the homelab docker-compose stack (merge it into the existing file).
# Build context is the REPOSITORY ROOT, hence "context: ../.." relative to this file; if you
# copy the snippet elsewhere, point "context" at a checkout of this repo.
#
# The real ".env" (VAST_API_KEY, AUTHENTIK_* ...) lives ONLY on the homelab next to the
# compose file. It is never committed; see deploy/web/README.md for the key names.
services:
  vast-comfy-web:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
    image: vast-comfy-web:local
    container_name: vast-comfy-web
    restart: unless-stopped
    # On "docker stop" the service drains for WEB_SHUTDOWN_WAIT_S (default 15 s) and a Destroy
    # already in flight needs its Vast retry budget: 3 attempts (WEB_DESTROY_RETRIES) of up to
    # 10 s each (HTTP_TIMEOUT_S_APPS) with 2 x 5 s backoff (WEB_DESTROY_BACKOFF_S) = 40 s.
    # 15 + 40 = 55 s, so 60 s lets Docker wait instead of SIGKILLing the process in the middle
    # of a destroy. Raise it if you raise any of those keys.
    stop_grace_period: 60s
    env_file: .env
    environment:
      # Paths inside the container (not secrets). The registry lives on the named volume.
      REGISTRY_PATH: /data/registry.json
      TS_AUTHKEY_FILE: /run/secrets/ts-authkey
      WEB_PORT: "3000"
    volumes:
      - vast-comfy-registry:/data
      # Manually created single-use Tailscale auth key (mode 600), read-only. Replace the host
      # path placeholder. The file must be readable by uid 1000 (the "node" user).
      - /path/on/homelab/ts-authkey:/run/secrets/ts-authkey:ro
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    # No "ports:" on purpose. The service is reachable only through the Authentik proxy outpost
    # on the shared external network below.
    networks:
      - authentik_proxy
    # Reaching tailnet IPs/names from a bridge network: see "Reaching the instance" in the
    # README. If the host resolver does not resolve MagicDNS names, uncomment:
    # dns:
    #   - 100.100.100.100
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
    pids_limit: 128

volumes:
  vast-comfy-registry:

networks:
  # PLACEHOLDER: the existing external Docker network that the Authentik proxy outpost is on.
  authentik_proxy:
    external: true
