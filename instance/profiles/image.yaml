# Image profile, measured in spike S3 (docs/spikes/S3-qwen-image-gguf.md).
# Source: mirror 0xSojalSec/Qwen-Image-2.1-Uncensored-HF, byte-identical to the author's repo
# abenzerps/Qwen-Image-2.1-Uncensored-GGUF (renamed ...-Uncensored-Quantized); SHA256 of all three files match.
name: image
# disk_gb counts the video model files (about 18 GB) too. Only a boot that includes them (Start dialog "Include video
# models") needs it: the web app then rents VAST_VIDEO_DISK_GB; an image-only boot keeps VAST_DISK_GB.
requires: {vram_gb: 24, disk_gb: 80}
nodes:
  # leejet fork: native Qwen-Image 2.1 GGUF support (city96/ComfyUI-GGUF fails with "Unknown model architecture").
  - {repo: leejet/ComfyUI-GGUF, commit: 373048b8403a7820620065210a691263d4da0a61}
# Node classes the nodes above must register; boot checks them via ComfyUI /object_info before `ready`.
provides_node_classes: [UnetLoaderGGUF, TextEncodeQwenImage21, QwenImage21Cache]
models:
  - {file: qwen-image-2.1-UC-Q4_K_M.gguf, repo: 0xSojalSec/Qwen-Image-2.1-Uncensored-HF, revision: d94be5d7a09b47b0211b03d0f23d20bc18203358, dest: models/diffusion_models/, size_bytes: 4604558112}
  - {file: text_encoders/qwen3vl_8b_int8_convrot.safetensors, repo: 0xSojalSec/Qwen-Image-2.1-Uncensored-HF, revision: d94be5d7a09b47b0211b03d0f23d20bc18203358, dest: models/text_encoders/, size_bytes: 9350798360}
  - {file: vae/qwen_image_2.1_vae_bf16.safetensors, repo: 0xSojalSec/Qwen-Image-2.1-Uncensored-HF, revision: d94be5d7a09b47b0211b03d0f23d20bc18203358, dest: models/vae/, size_bytes: 675509688}
  # Style "Anything to Real" (styles: below). License Apache-2.0 (model card front matter and HF license tag,
  # checked 2026-10-18 at this revision). Pinned with scripts/pin_model.py; HF LFS sha256
  # 5db4dd2376e6017812bf1189b2fc46e52aaa2c0b7e688faac75e83e1c4dce849.
  - {file: "Qwen2.1_Anything2RealCharacters.safetensors", repo: "WarmBloodAban/Qwen-Image-2.1-LoRAs", revision: "c4ab5473bfdf585fc19cfd1e280f79d2b0c79947", dest: "models/loras/", size_bytes: 318820200}
  # Upscale model (upscale: below): Real-ESRGAN x4plus as safetensors, repackaged for ComfyUI by Comfy-Org (no
  # pickle). License BSD-3-Clause (repo card; upstream xinntao/Real-ESRGAN is BSD-3-Clause), checked 2026-10-18.
  # HF LFS sha256 37f9a931c215f040aa6d50f711f2cb115f713c46df1d0d6469a8bd7bfe9a60bb.
  - {file: "RealESRGAN_x4plus.safetensors", repo: "Comfy-Org/Real-ESRGAN_repackaged", revision: "5fd49b7b278836f48af63ecd314d0f98ab336105", dest: "models/upscale_models/", size_bytes: 66857836}
  # Video (video: below) needs three more files, about 18 GB. They are NOT listed yet because a cloud session cannot
  # reach Hugging Face to read their commit and size, and an entry is never written from memory. Before setting
  # `video.enabled: true` the owner runs, on the laptop (licence check first: the model card of each repo):
  #   python3 scripts/pin_model.py Comfy-Org/Wan_2.2_ComfyUI_Repackaged split_files/diffusion_models/wan2.2_ti2v_5B_fp16.safetensors models/diffusion_models/
  #   python3 scripts/pin_model.py Comfy-Org/Wan_2.2_ComfyUI_Repackaged split_files/vae/wan2.2_vae.safetensors models/vae/
  #   python3 scripts/pin_model.py Comfy-Org/Wan_2.1_ComfyUI_repackaged split_files/text_encoders/umt5_xxl_fp8_e4m3fn_scaled.safetensors models/text_encoders/
  # and pastes the three printed lines here. (If a file is not in that repo, pin_model.py says so: look for it in the
  # other repackaged repo instead.) With video enabled and any of the three missing here, both the web app and the
  # instance refuse the profile at startup with "video model ... is not listed in models".
workflows: [qwen-image-t2i.json, qwen-image-edit.json, image-upscale.json, video-ti2v.json]
# How the web app fills workflows/qwen-image-t2i.json (node ids refer to that file; sizes are multiples of 32).
generate:
  workflow: qwen-image-t2i.json
  params:
    prompt: {node: "5", input: text}
    steps: {node: "8", input: steps}
    width: {node: "7", input: width}
    height: {node: "7", input: height}
    seed: {node: "8", input: seed}
    # Optional knobs of the Advanced section: where a negative prompt and the sampler's cfg go in this workflow (node 6
    # is the empty negative CLIPTextEncode feeding KSampler.negative). Leave a line out and the page does not offer
    # that knob in Generate; a request that sends it anyway gets negative_prompt_unavailable / cfg_unavailable.
    negative_prompt: {node: "6", input: text}
    cfg: {node: "8", input: cfg}
  quality_presets:
    preview: {steps: 10}
    standard: {steps: 25}
    high: {steps: 40}
  sizes:
    - {name: "1:1", width: 1024, height: 1024}
    - {name: "3:4", width: 896, height: 1152}
    - {name: "4:3", width: 1152, height: 896}
    - {name: "16:9", width: 1344, height: 768}
    - {name: "9:16", width: 768, height: 1344}
# Edit with reference images (spike S6, docs/superpowers/plans/2026-10-18-image-edit.md). The web app copies
# workflows/qwen-image-edit.json, adds one `references.node_class` node per reference (ids `ref_1`..`ref_N`)
# and wires each to `references.encoder.node` as `<input_prefix><k>` (k starts at 1). Quality presets are the
# generate ones. `resolution` is the encoder's total pixel budget (not width/height); only 1024 was measured.
edit:
  workflow: qwen-image-edit.json
  params:
    prompt: {node: "6", input: prompt}
    steps: {node: "7", input: steps}
    seed: {node: "7", input: seed}
    resolution: {node: "6", input: resolution}
    # Optional knobs (see generate): TextEncodeQwenImage21 has its own negative_prompt input (its output 1 feeds
    # KSampler.negative), and the sampler's cfg.
    negative_prompt: {node: "6", input: negative_prompt}
    cfg: {node: "7", input: cfg}
  references:
    node_class: LoadImage
    image_input: image
    encoder: {node: "6", input_prefix: "images.image_"}
  resolutions:
    - {name: "1024", value: 1024}
  # Optional output sizes for an edit. Without one the result follows the first reference (the workflow as it ships).
  # With one the sampler gets an empty latent of that size instead of the encoder's (`size_latent` is the sampler input
  # that is rewired). UNVERIFIED on this model: compare the same edit with and without a size before relying on it.
  sizes:
    - {name: "1:1", width: 1024, height: 1024}
    - {name: "3:4", width: 896, height: 1152}
    - {name: "16:9", width: 1344, height: 768}
    - {name: "9:16", width: 768, height: 1344}
  size_latent: {node: "7", input: latent_image}

# Guidance (the sampler's cfg) the Advanced section offers for every workflow that maps `cfg`. `default` must equal
# the cfg the workflows ship with (1.0; the web app refuses to start otherwise): when the user changes nothing the
# page sends no cfg and the job runs exactly as before. At cfg 1.0 ComfyUI skips the negative branch, so a negative
# prompt only counts above 1.0, and sampling then takes roughly twice as long. UNVERIFIED for Qwen-Image 2.1 (GGUF,
# generate and edit): whether guidance above 1 and a negative prompt improve or harm results has not been tried on a
# real instance; compare a few values on the same seed before changing any default.
guidance: {min: 1.0, max: 6.0, step: 0.5, default: 1.0}

# The tool menu of the page (deploy/web/README.md "Menu"): ordered categories, and the built-in tools (plain
# generate, plain edit, upscale, video), at most one per mode. Every enabled style below is its own entry too; a style may
# set `category` (one of these ids), `description` (one line, at most 120 characters), `icon` (one of the page's
# built-in icons: image, wand, user, users, swap, shirt, restore, sparkles, expand, camera, brush, film) and `order`
# (lower first inside its category; entries without one come last, in profile order). A style without a category
# or icon takes those of its mode's tool. An edit, upscale or video entry shows only while that mode is on (the API
# marks it unavailable otherwise).
menu:
  categories:
    - {id: create, title: Create}
    - {id: edit, title: "Edit & combine"}
    - {id: enhance, title: Enhance}
  tools:
    - {id: text_to_image, title: Text to image, description: "Describe a picture and generate it.", icon: image, mode: generate, category: create, order: 10}
    - {id: free_edit, title: Free edit, description: "Change or combine your images with an instruction.", icon: wand, mode: edit, category: edit, order: 10}
    - {id: upscale, title: Upscale, description: "Make an image two or four times bigger.", icon: expand, mode: upscale, category: enhance, order: 20}
    - {id: video, title: Video, description: "Make a short video from a description, or bring a picture to life.", icon: film, mode: video, category: create, order: 50}

# Styles: a LoRA (kind: lora, the default) or a preset prompt (kind: preset) with its own parameters, each offered
# as its own entry of the tool menu (menu: above) in the mode(s) it lists. This is the ONLY preset mechanism (the "recipes" of branch feat/recipes-negative-prompt were
# folded into it). Optional `defaults` are values the page pre-fills when the style is chosen and the user can change:
# negative_prompt, cfg (on the guidance grid), preset (quality), size (generate styles) and resolution (edit styles).
# The server never applies them on its own: a request runs with what it sends. (Design:
# docs/superpowers/plans/2026-10-18-styles-and-chaining-design.md). A style is OFF until `enabled: true`, and an
# enabled style needs its LoRA in `models:` with dest models/loras/ (pin it with scripts/pin_model.py).
# "Anything to Real" is ON for the live test: its LoRA is pinned above and the agent downloads it at boot. `lora.model_from` is the node whose MODEL
# output the loader takes and `model_to` the input that is rewired to the loader; where it sits relative to
# QwenImage21Cache is UNVERIFIED (live test): change these two lines if the test shows another placement.
styles:
  # "Anime / cartoon to real": the Anything to Real LoRA plus its own instruction (a LoRA style may also have a
  # prompt_template and references). Exactly one image; the user's prompt is optional notes in place of {prompt}.
  # Strength 0 leaves the LoRA loader out (prompt only, as the instruction worked without a LoRA in spike S6).
  - id: anything2real
    title: Anime / cartoon to real
    category: edit
    description: "Turn an anime or cartoon character into a realistic photo."
    icon: camera
    order: 20
    modes: [edit]
    enabled: true
    lora:
      file: Qwen2.1_Anything2RealCharacters.safetensors
      model_from: "1"
      model_to: {node: "4", input: model}
    prompt_template: "Convert this anime or cartoon illustration into a realistic photograph of a real person. Keep the same pose, facial expression, hairstyle and hair color, outfit, background and composition. Natural skin texture and realistic lighting. {prompt}"
    references: {min: 1, max: 1, labels: ["Image to convert"]}
    hint: "LoRA strength 0 = prompt only, no LoRA. Works best on characters and people."
    params:
      - {id: strength, title: LoRA strength, type: float, min: 0.0, max: 1.0, step: 0.05, default: 0.7, target: lora_strength}
  # "Face swap": a preset (no LoRA, nothing to download), edit only. It sends the owner's tested instruction with the
  # user's optional notes in place of {prompt}, and needs exactly two references: <image1> is the scene to keep, <image2>
  # the face to use. The whole prompt must fit GENERATE_MAX_PROMPT_CHARS.
  - id: faceswap
    title: Face swap
    category: edit
    description: "Put the face from one photo onto the person in another."
    icon: swap
    order: 30
    kind: preset
    modes: [edit]
    enabled: true
    prompt_template: "Edit <image1>: replace only the face of the person in <image1> with the face of the person in <image2>. Keep the body, pose, hair, clothing, background, lighting and camera framing of <image1> exactly the same. The result must contain exactly one person. {prompt}"
    references: {min: 2, max: 2, labels: ["Scene to keep", "Face to use"]}
    hint: "Results depend on the model. Only use a face with the consent of the person in the second photo."
  # Sample presets ported from the recipes of feat/recipes-negative-prompt. ON for the live test (2026-10-20): they
  # are presets, so they download nothing. Their wording is a first draft, never compared on real output, and their
  # negative prompt and cfg defaults are UNVERIFIED for this model (and QwenImage21Cache): the page only pre-fills
  # them and the user can change or clear each one; the live test decides whether they stay. The recipe
  # "face_swap" was not ported: `faceswap` above (the owner's tested instruction) replaces it.
  - id: portrait_photo
    title: Portrait photo
    category: create
    description: "A realistic portrait with natural skin and soft light."
    icon: user
    order: 20
    kind: preset
    modes: [generate]
    enabled: true
    prompt_template: "A realistic portrait photograph with natural skin texture, fine pores and small imperfections, soft natural light, shallow depth of field, 85mm lens, true-to-life colors and sharp eyes. {prompt}"
    hint: "Describe the person in the notes. Pre-fills guidance 3 and a negative prompt (untested on this model; change or reset them under Advanced)."
    defaults:
      negative_prompt: "plastic skin, airbrushed, waxy, oversmoothed, uncanny face, deformed hands, extra fingers, blurry, low quality, watermark, text, oversaturated"
      cfg: 3.0
  - id: family_photo
    title: Family photo
    category: create
    description: "A warm, candid photo of a group of people."
    icon: users
    order: 30
    kind: preset
    modes: [generate]
    enabled: true
    prompt_template: "A warm, candid family photograph, everyone looking natural and relaxed, realistic faces and hands, natural daylight, 50mm lens, true-to-life colors, detailed clothing. {prompt}"
    hint: "Describe who is in the photo and where. Pre-fills guidance 3 and a negative prompt (untested on this model; change or reset them under Advanced)."
    defaults:
      negative_prompt: "plastic skin, distorted faces, merged people, extra fingers, deformed hands, extra limbs, blurry, low quality, watermark, text"
      cfg: 3.0
  - id: anime
    title: Anime illustration
    category: create
    description: "An anime-style illustration from your description."
    icon: sparkles
    order: 40
    kind: preset
    modes: [generate]
    enabled: true
    prompt_template: "A high-quality anime illustration with clean line art, expressive eyes, detailed cel shading and a balanced color palette. {prompt}"
    hint: "Describe the scene in the notes. Pre-fills guidance 3 and a negative prompt (untested on this model; change or reset them under Advanced)."
    defaults:
      negative_prompt: "photorealistic, 3d render, blurry, low quality, jpeg artifacts, bad anatomy, extra fingers, watermark, text"
      cfg: 3.0
  - id: outfit_swap
    title: Outfit swap
    category: edit
    description: "Dress the person in one photo in the clothing from another."
    icon: shirt
    order: 40
    kind: preset
    modes: [edit]
    enabled: true
    prompt_template: "Make the person in <image1> wear the clothing from <image2>. Keep the face, pose, background and lighting of <image1> unchanged. {prompt}"
    references: {min: 2, max: 2, labels: ["Person", "Clothing to use"]}
    hint: "Pre-fills a negative prompt (untested; it only counts with guidance above 1, under Advanced)."
    defaults:
      negative_prompt: "changed face, changed pose, mismatched lighting, blurry, distorted clothing"
  - id: photo_restore
    title: Restore old photo
    category: enhance
    description: "Repair scratches, noise and faded colors of an old photo."
    icon: restore
    order: 10
    kind: preset
    modes: [edit]
    enabled: true
    prompt_template: "Restore this old photograph: remove scratches, dust and noise, repair damaged areas, correct the faded colors and sharpen the detail while keeping every face and the identity of every person exactly the same. {prompt}"
    references: {min: 1, max: 1, labels: ["Photo to restore"]}
    hint: "Pre-fills a negative prompt (untested; it only counts with guidance above 1, under Advanced)."
    defaults:
      negative_prompt: "changed faces, new people, over-smoothed skin, artifacts"
  - id: to_anime
    title: Photo to anime
    category: edit
    description: "Redraw a photo as an anime illustration."
    icon: brush
    order: 50
    kind: preset
    modes: [edit]
    enabled: true
    prompt_template: "Redraw <image1> as a high-quality anime illustration with clean line art and cel shading, keeping the identity, pose and composition. {prompt}"
    references: {min: 1, max: 1, labels: ["Photo to redraw"]}
    hint: "Pre-fills a negative prompt (untested; it only counts with guidance above 1, under Advanced)."
    defaults:
      negative_prompt: "photorealistic, 3d render, blurry, low quality"

# Upscale mode (design: docs/superpowers/plans/2026-10-18-styles-and-chaining-design.md, section 6): one image in,
# a bigger one out through an upscale model (ImageUpscaleWithModel). ON for the live test with Real-ESRGAN x4plus
# (BSD-3-Clause, pinned above with dest models/upscale_models/). To change the model: check its license, pin it with
# scripts/pin_model.py <repo> <file> models/upscale_models/, set `model:` and `model_factor` to match.
# The model upscales by its own fixed factor (`model_factor`, 4 for x4 models) and `scales` trims that with
# ImageScaleBy: value 0.5 gives 2x, 1.0 gives 4x. `factor` is the final enlargement; it must equal
# model_factor x value (the loader refuses the profile otherwise). The web app bounds both the model's
# intermediate image (UPSCALE_MAX_INTERMEDIATE_PIXELS) and the result (UPSCALE_MAX_OUTPUT_PIXELS).
upscale:
  enabled: true
  workflow: image-upscale.json
  model: RealESRGAN_x4plus.safetensors
  model_factor: 4
  model_loader: {node: "2", input: model_name}
  image: {node: "1", input: image}
  scale: {node: "4", input: scale_by}
  scales:
    - {name: "2x", value: 0.5, factor: 2}
    - {name: "4x", value: 1.0, factor: 4}

# Video mode (deploy/web/README.md "Video"): text to video, or image to video when the user attaches exactly one start
# image, with ONE model through native ComfyUI nodes only (workflows/video-ti2v.json; no custom node). OFF until the
# owner has pinned the three model files (see the comment under `models:`) and set `enabled: true`. Everything here
# is validated even while it is off; with `enabled: true` each file of `models` below must be listed in the
# profile's `models:` with this dest. They are downloaded at boot only when the Start dialog's "Include video models" is
# ticked (INCLUDE_VIDEO_MODELS on the instance); such a boot also requires `node_classes` from ComfyUI's /object_info
# before it reports ready (an image whose ComfyUI is too old for these nodes fails the boot loudly). Without it an
# admin can download them later from the Video tool; the agent then checks the same node classes first.
# The web app copies the workflow, sets the mapped inputs and, with a start image, adds one LoadImage node (id
# `video_start`) wired to `start_image`. UNVERIFIED (never run on a real instance): the graph and its node and input
# names, the h264 mp4 output of SaveVideo, VRAM use at these sizes on a 24 GB card, the time a clip takes, and that
# phones play the result. Sizes are multiples of 32; frames are 4n+1 (the latent packs 4 frames per step).
video:
  enabled: false
  workflow: video-ti2v.json
  models:
    - {file: wan2.2_ti2v_5B_fp16.safetensors, dest: models/diffusion_models/}
    - {file: umt5_xxl_fp8_e4m3fn_scaled.safetensors, dest: models/text_encoders/}
    - {file: wan2.2_vae.safetensors, dest: models/vae/}
  node_classes: [UNETLoader, CLIPLoader, VAELoader, ModelSamplingSD3, CLIPTextEncode, Wan22ImageToVideoLatent, KSampler, VAEDecode, CreateVideo, SaveVideo, LoadImage]
  params:
    prompt: {node: "5", input: text}
    seed: {node: "8", input: seed}
    width: {node: "7", input: width}
    height: {node: "7", input: height}
    length: {node: "7", input: length}
    fps: {node: "10", input: fps}
  start_image: {node: "7", input: start_image}
  output_node: "11"
  fps: 24
  sizes:
    - {name: "Landscape", width: 1280, height: 704}
    - {name: "Portrait", width: 704, height: 1280}
    - {name: "Landscape, faster", width: 832, height: 480}
    - {name: "Portrait, faster", width: 480, height: 832}
  durations:
    - {name: "About 3 s", frames: 73}
    - {name: "About 5 s", frames: 121}
