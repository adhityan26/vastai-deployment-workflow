# Image profile, measured in spike S3 (docs/spikes/S3-qwen-image-gguf.md).
# Source: mirror 0xSojalSec/Qwen-Image-2.1-Uncensored-HF, byte-identical to the author's repo
# abenzerps/Qwen-Image-2.1-Uncensored-GGUF (renamed ...-Uncensored-Quantized); SHA256 of all three files match.
name: image
requires: {vram_gb: 24, disk_gb: 40}
nodes:
  # leejet fork: native Qwen-Image 2.1 GGUF support (city96/ComfyUI-GGUF fails with "Unknown model architecture").
  - {repo: leejet/ComfyUI-GGUF, commit: 373048b8403a7820620065210a691263d4da0a61}
# Node classes the nodes above must register; boot checks them via ComfyUI /object_info before `ready`.
provides_node_classes: [UnetLoaderGGUF, TextEncodeQwenImage21, QwenImage21Cache]
models:
  - {file: qwen-image-2.1-UC-Q4_K_M.gguf, repo: 0xSojalSec/Qwen-Image-2.1-Uncensored-HF, revision: d94be5d7a09b47b0211b03d0f23d20bc18203358, dest: models/diffusion_models/, size_bytes: 4604558112}
  - {file: text_encoders/qwen3vl_8b_int8_convrot.safetensors, repo: 0xSojalSec/Qwen-Image-2.1-Uncensored-HF, revision: d94be5d7a09b47b0211b03d0f23d20bc18203358, dest: models/text_encoders/, size_bytes: 9350798360}
  - {file: vae/qwen_image_2.1_vae_bf16.safetensors, repo: 0xSojalSec/Qwen-Image-2.1-Uncensored-HF, revision: d94be5d7a09b47b0211b03d0f23d20bc18203358, dest: models/vae/, size_bytes: 675509688}
workflows: [qwen-image-t2i.json, qwen-image-edit.json, image-upscale.json]
# How the web app fills workflows/qwen-image-t2i.json (node ids refer to that file; sizes are multiples of 32).
generate:
  workflow: qwen-image-t2i.json
  params:
    prompt: {node: "5", input: text}
    steps: {node: "8", input: steps}
    width: {node: "7", input: width}
    height: {node: "7", input: height}
    seed: {node: "8", input: seed}
  quality_presets:
    preview: {steps: 10}
    standard: {steps: 25}
    high: {steps: 40}
  sizes:
    - {name: "1:1", width: 1024, height: 1024}
    - {name: "3:4", width: 896, height: 1152}
    - {name: "4:3", width: 1152, height: 896}
    - {name: "16:9", width: 1344, height: 768}
    - {name: "9:16", width: 768, height: 1344}
# Edit with reference images (spike S6, docs/superpowers/plans/2026-10-18-image-edit.md). The web app copies
# workflows/qwen-image-edit.json, adds one `references.node_class` node per reference (ids `ref_1`..`ref_N`)
# and wires each to `references.encoder.node` as `<input_prefix><k>` (k starts at 1). Quality presets are the
# generate ones. `resolution` is the encoder's total pixel budget (not width/height); only 1024 was measured.
edit:
  workflow: qwen-image-edit.json
  params:
    prompt: {node: "6", input: prompt}
    steps: {node: "7", input: steps}
    seed: {node: "7", input: seed}
    resolution: {node: "6", input: resolution}
  references:
    node_class: LoadImage
    image_input: image
    encoder: {node: "6", input_prefix: "images.image_"}
  resolutions:
    - {name: "1024", value: 1024}

# Styles: a LoRA with its own parameters, offered as a sub-menu of a mode (design:
# docs/superpowers/plans/2026-10-18-styles-and-chaining-design.md). A style is OFF until `enabled: true`.
# To turn "Anything to Real" on: (1) on a machine with internet run
#   python3 scripts/pin_model.py WarmBloodAban/Qwen-Image-2.1-LoRAs Qwen2.1_Anything2RealCharacters.safetensors
# (2) add the `models:` line it prints (dest models/loras/) to the models list above, (3) set enabled: true.
# The agent then downloads the LoRA at boot with the other models. `lora.model_from` is the node whose MODEL
# output the loader takes and `model_to` the input that is rewired to the loader; where it sits relative to
# QwenImage21Cache is UNVERIFIED (live test): change these two lines if the test shows another placement.
styles:
  - id: anything2real
    title: Anything to Real
    modes: [edit]
    enabled: false
    lora:
      file: Qwen2.1_Anything2RealCharacters.safetensors
      model_from: "1"
      model_to: {node: "4", input: model}
    params:
      - {id: strength, title: LoRA strength, type: float, min: 0.4, max: 1.0, step: 0.05, default: 0.7, target: lora_strength}

# Upscale mode (design: docs/superpowers/plans/2026-10-18-styles-and-chaining-design.md, section 6): one image in,
# a bigger one out through an upscale model (ImageUpscaleWithModel). OFF until `enabled: true`. To turn it on:
# (1) CHECK THE LICENSE of the upscale model you pick (not done yet; Real-ESRGAN and 4x-UltraSharp differ),
# (2) on a machine with internet run scripts/pin_model.py <repo> <file> models/upscale_models/ and add the line it
# prints to `models:` above, (3) set `model:` to that file's name and `enabled: true`.
# The model upscales by its own fixed factor (`model_factor`, 4 for x4 models) and `scales` trims that with
# ImageScaleBy: value 0.5 gives 2x, 1.0 gives 4x. `factor` is the final enlargement; it must equal
# model_factor x value (the loader refuses the profile otherwise). The web app bounds both the model's
# intermediate image (UPSCALE_MAX_INTERMEDIATE_PIXELS) and the result (UPSCALE_MAX_OUTPUT_PIXELS).
upscale:
  enabled: false
  workflow: image-upscale.json
  model: REPLACE_WITH_PINNED_UPSCALE_MODEL.pth
  model_factor: 4
  model_loader: {node: "2", input: model_name}
  image: {node: "1", input: image}
  scale: {node: "4", input: scale_by}
  scales:
    - {name: "2x", value: 0.5, factor: 2}
    - {name: "4x", value: 1.0, factor: 4}
